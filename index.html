```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Wallverse | Wallpaper Universe</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#070811;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

header{
  position:sticky;
  top:0;
  z-index:100;
  height:70px;
  padding:0 5%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:rgba(7,8,17,.92);
  backdrop-filter:blur(18px);
  border-bottom:1px solid #24263b;
}

.logo{
  font-size:27px;
  font-weight:900;
}

.logo span{
  color:#8b6cff;
}

nav a{
  color:#ddd;
  text-decoration:none;
  margin-left:24px;
  font-size:14px;
}

nav a:hover{
  color:#9e8cff;
}

.hero{
  min-height:430px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:50px 20px;
  background:
    radial-gradient(circle at 50% 30%,#31256b,transparent 48%),
    #070811;
}

.hero h1{
  font-size:clamp(50px,9vw,100px);
  font-weight:1000;
  background:linear-gradient(90deg,#8c75ff,#d86cff,#62d9ff);
  -webkit-background-clip:text;
  color:transparent;
}

.hero p{
  margin:15px 0 30px;
  color:#aeb0c1;
  font-size:18px;
}

.search{
  width:min(700px,92%);
  padding:18px 24px;
  border-radius:50px;
  border:1px solid #383b55;
  outline:none;
  background:#111322;
  color:white;
  font-size:16px;
}

.search:focus{
  border-color:#8b6cff;
}

.container{
  width:90%;
  max-width:1500px;
  margin:auto;
}

h2{
  margin:45px 0 20px;
  font-size:30px;
}

.categories{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:30px;
}

.category{
  padding:10px 18px;
  border-radius:30px;
  border:1px solid #34374e;
  background:#111322;
  color:#ddd;
  cursor:pointer;
}

.category:hover,
.category.active{
  background:#8064ff;
  border-color:#8064ff;
  color:white;
}

.gallery{
  columns:5 190px;
  column-gap:16px;
}

.card{
  position:relative;
  break-inside:avoid;
  margin-bottom:16px;
  overflow:hidden;
  border-radius:15px;
  background:#111322;
  border:1px solid #24273c;
  transition:.25s;
  cursor:pointer;
}

.card:hover{
  transform:translateY(-5px);
  border-color:#8064ff;
}

.card img{
  width:100%;
  display:block;
  min-height:190px;
  object-fit:cover;
  background:#15182a;
}

.info{
  padding:12px;
}

.info h3{
  font-size:15px;
  margin-bottom:5px;
}

.info p{
  color:#85899d;
  font-size:12px;
}

.heart{
  position:absolute;
  top:10px;
  right:10px;
  width:38px;
  height:38px;
  border:none;
  border-radius:50%;
  background:rgba(0,0,0,.7);
  color:#fff;
  font-size:20px;
  cursor:pointer;
  z-index:5;
}

.heart.liked{
  color:#ff4d91;
}

.load{
  display:block;
  margin:40px auto 70px;
  padding:15px 35px;
  border:none;
  border-radius:30px;
  background:#8064ff;
  color:white;
  font-size:16px;
  cursor:pointer;
}

.load:hover{
  transform:scale(1.05);
}

.empty{
  display:none;
  text-align:center;
  color:#888;
  padding:60px;
}

.modal{
  position:fixed;
  inset:0;
  display:none;
  justify-content:center;
  align-items:center;
  padding:20px;
  background:rgba(0,0,0,.94);
  z-index:999;
}

.modal-box{
  width:min(1000px,96%);
  max-height:94vh;
  overflow:auto;
  background:#111322;
  border-radius:18px;
  padding:18px;
  position:relative;
}

.modal-box img{
  display:block;
  width:100%;
  max-height:75vh;
  object-fit:contain;
  border-radius:12px;
}

.close{
  position:absolute;
  right:20px;
  top:20px;
  width:42px;
  height:42px;
  border:none;
  border-radius:50%;
  background:#000b;
  color:white;
  font-size:25px;
  cursor:pointer;
}

.download{
  display:inline-block;
  margin-top:15px;
  padding:13px 25px;
  border-radius:25px;
  background:#8064ff;
  color:white;
  text-decoration:none;
}

footer{
  margin-top:50px;
  padding:40px;
  text-align:center;
  color:#777b90;
  border-top:1px solid #22253a;
}

@media(max-width:800px){
  .gallery{
    columns:3 150px;
  }
}

@media(max-width:500px){
  header{
    padding:0 4%;
  }

  nav a{
    margin-left:8px;
  }

  .gallery{
    columns:2 130px;
  }
}
</style>
</head>

<body>

<header>

  <div class="logo">
    🌌 Wall<span>verse</span>
  </div>

  <nav>
    <a href="#">Home</a>
    <a href="#wallpapers">Wallpapers</a>
  </nav>

</header>


<section class="hero">

  <h1>WALLVERSE</h1>

  <p>Discover your next favorite wallpaper.</p>

  <input
    class="search"
    id="search"
    type="text"
    placeholder="🔍 Search wallpapers..."
  >

</section>


<main class="container" id="wallpapers">

  <h2>🔥 Explore Wallpapers</h2>

  <div class="categories">

    <button class="category active"
      onclick="filterCategory('all',this)">
      All
    </button>

    <button class="category"
      onclick="filterCategory('nature',this)">
      🌿 Nature
    </button>

    <button class="category"
      onclick="filterCategory('anime',this)">
      🎨 Anime
    </button>

    <button class="category"
      onclick="filterCategory('cars',this)">
      🚗 Cars
    </button>

    <button class="category"
      onclick="filterCategory('space',this)">
      🌌 Space
    </button>

    <button class="category"
      onclick="filterCategory('city',this)">
      🏙️ City
    </button>

    <button class="category"
      onclick="filterCategory('abstract',this)">
      ✨ Abstract
    </button>

  </div>

  <div class="gallery" id="gallery"></div>

  <div class="empty" id="empty">
    😢 No wallpapers found.
  </div>

  <button class="load" id="load">
    Load More Wallpapers
  </button>

</main>


<div class="modal" id="modal">

  <div class="modal-box">

    <button class="close" onclick="closeModal()">×</button>

    <img id="preview">

    <a
      id="download"
      class="download"
      target="_blank">
      ⬇️ Open Full Wallpaper
    </a>

  </div>

</div>


<footer>
  © 2026 Wallverse — Your Universe of Wallpapers 🌌
</footer>


<script>

/*
=========================================================
WALLPAPER DATA
=========================================================

Each entry contains:

title
category
image

To add more wallpapers, simply add another object.

IMPORTANT:
Use images you own or have permission to publish.
=========================================================
*/

const wallpapers = [

/* NATURE */

{
 title:"Mountain Sunrise",
 category:"nature",
 image:"https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=900&q=85"
},

{
 title:"Forest Road",
 category:"nature",
 image:"https://images.unsplash.com/photo-1448375240586-882707db888b?auto=format&fit=crop&w=900&q=85"
},

{
 title:"Ocean Waves",
 category:"nature",
 image:"https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=900&q=85"
},

{
 title:"Green Mountains",
 category:"nature",
 image:"https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=900&q=85"
},

{
 title:"Waterfall",
 category:"nature",
 image:"https://images.unsplash.com/photo-1433086966358-54859d0ed716?auto=format&fit=crop&w=900&q=85"
},

/* SPACE */

{
 title:"Galaxy",
 category:"space",
 image:"https://images.unsplash.com/photo-1462331940025-496dfbfc7564?auto=format&fit=crop&w=900&q=85"
},

{
 title:"Starry Sky",
 category:"space",
 image:"https://images.unsplash.com/photo-1516339901601-2e1b62dc0c45?auto=format&fit=crop&w=900&q=85"
},

{
 title:"Deep Space",
 category:"space",
 image:"https://images.unsplash.com/photo-1534791547706-6c7c1d0c0c9f?auto=format&fit=crop&w=900&q=85"
},

{
 title:"Moon",
 category:"space",
 image:"https://images.unsplash.com/photo-1444703686981-a3abbc4d4fe3?auto=format&fit=crop&w=900&q=85"
},

/* CARS */

{
 title:"Porsche",
 category:"cars",
 image:"https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&fit=crop&w=900&q=85"
},

{
 title:"Sports Car",
 category:"cars",
 image:"https://images.unsplash.com/photo-1492144534655-ae79c964c9d7?auto=format&fit=crop&w=900&q=85"
},

{
 title:"Luxury Car",
 category:"cars",
 image:"https://images.unsplash.com/photo-1553440569-bcc63803a83d?auto=format&fit=crop&w=900&q=85"
},

/* CITY */

{
 title:"City Lights",
 category:"city",
 image:"https://images.unsplash.com/photo-1519501025264-65ba15a82390?auto=format&fit=crop&w=900&q=85"
},

{
 title:"Tokyo Night",
 category:"city",
 image:"https://images.unsplash.com/photo-1513407030348-c983a97b98d8?auto=format&fit=crop&w=900&q=85"
},

{
 title:"Urban Night",
 category:"city",
 image:"https://images.unsplash.com/photo-1514565131-fce0801e5785?auto=format&fit=crop&w=900&q=85"
},

/* ABSTRACT */

{
 title:"Purple Waves",
 category:"abstract",
 image:"https://images.unsplash.com/photo-1557682250-33bd709cbe85?auto=format&fit=crop&w=900&q=85"
},

{
 title:"Color Flow",
 category:"abstract",
 image:"https://images.unsplash.com/photo-1557682260-96773eb01377?auto=format&fit=crop&w=900&q=85"
},

/* ANIME-STYLE / ILLUSTRATION CATEGORY */

{
 title:"Fantasy Warrior",
 category:"anime",
 image:"https://images.unsplash.com/photo-1578632767115-351597cf2477?auto=format&fit=crop&w=900&q=85"
},

{
 title:"Fantasy World",
 category:"anime",
 image:"https://images.unsplash.com/photo-1577083288073-40892c0860a4?auto=format&fit=crop&w=900&q=85"
}

];


/*
=========================================================
CREATE MORE DEMO ENTRIES
=========================================================
*/

const base = [...wallpapers];

for(let i=1;i<=15;i++){

  base.forEach((item,index)=>{

    wallpapers.push({

      title:item.title+" "+(i+1),

      category:item.category,

      image:item.image

    });

  });

}


/*
=========================================================
VARIABLES
=========================================================
*/

const gallery =
document.getElementById("gallery");

const search =
document.getElementById("search");

const empty =
document.getElementById("empty");

const loadButton =
document.getElementById("load");

const modal =
document.getElementById("modal");

const preview =
document.getElementById("preview");

const download =
document.getElementById("download");


let currentCategory="all";

let visibleCount=30;


/*
=========================================================
DISPLAY WALLPAPERS
=========================================================
*/

function displayWallpapers(){

  gallery.innerHTML="";

  const query =
    search.value.toLowerCase().trim();

  const filtered =
    wallpapers.filter(item=>{

      const matchesSearch =
        item.title.toLowerCase()
        .includes(query);

      const matchesCategory =
        currentCategory==="all" ||
        item.category===currentCategory;

      return matchesSearch &&
             matchesCategory;

    });


  const visible =
    filtered.slice(0,visibleCount);


  visible.forEach(item=>{

    const card =
      document.createElement("div");

    card.className="card";

    card.innerHTML=`

      <button class="heart">
        ♡
      </button>

      <img
        loading="lazy"
        src="${item.image}"
        alt="${item.title}">

      <div class="info">

        <h3>${item.title}</h3>

        <p>${item.category}</p>

      </div>
    `;


    const heart =
      card.querySelector(".heart");


    heart.addEventListener("click",(event)=>{

      event.stopPropagation();

      heart.classList.toggle("liked");

      heart.textContent =
        heart.classList.contains("liked")
        ? "♥"
        : "♡";

    });


    card.addEventListener("click",()=>{

      openModal(item.image);

    });


    gallery.appendChild(card);

  });


  empty.style.display =
    visible.length===0
    ? "block"
    : "none";


  loadButton.style.display =
    visible.length < filtered.length
    ? "block"
    : "none";

}


/*
=========================================================
SEARCH
=========================================================
*/

search.addEventListener("input",()=>{

  visibleCount=30;

  displayWallpapers();

});


/*
=========================================================
CATEGORY
=========================================================
*/

function filterCategory(category,button){

  currentCategory=category;

  visibleCount=30;

  document
    .querySelectorAll(".category")
    .forEach(btn=>{
      btn.classList.remove("active");
    });

  button.classList.add("active");

  displayWallpapers();

}


/*
=========================================================
LOAD MORE
=========================================================
*/

loadButton.addEventListener("click",()=>{

  visibleCount+=30;

  displayWallpapers();

});


/*
=========================================================
MODAL
=========================================================
*/

function openModal(image){

  preview.src=image;

  download.href=image;

  modal.style.display="flex";

}


function closeModal(){

  modal.style.display="none";

}


modal.addEventListener("click",(event)=>{

  if(event.target===modal){

    closeModal();

  }

});


/*
=========================================================
START
=========================================================
*/

displayWallpapers();

</script>

</body>
</html>
